<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IND Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #12141a;
            color: #e0e4ed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 600px;
            background: #1a1e28;
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a3142;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 1.05rem;
            color: #9aa5be;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #2563eb;
        }
        .footer {
            margin-top: 36px;
            font-size: 0.85rem;
            color: #636e88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2IND Games</h1>
        <p>인디 게임 스튜디오 2IND입니다.</p>
        <div class="links">
            <a class="btn" href="https://play.google.com/store/apps/details?id=com.iind.nono" target="_blank" rel="noopener">
                노노의 모험 (NONO's ADVENTURE) 보기
            </a>
            <a class="btn" href="./merge-rift/privacy.html">
                머지 리프트 (Merge Rift) 개인정보처리방침
            </a>
        </div>
        <div class="footer">
            &copy; 2IND Games. All rights reserved.
        </div>
    </div>
</body>
</html>
